services:
  ctfd:
    build: .
    restart: always
    # Secrets hors git : en prod, ctf-infra pose docker-compose.override.yml
    # (environnement lu dans /etc/ctfd/ctfd.env). Ailleurs, les fournir par
    # l'environnement ou un fichier .env non versionné.
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_URL=${REDIS_URL:-}
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
    network_mode: host
    depends_on:
      permissions:
        condition: service_completed_successfully

  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd
